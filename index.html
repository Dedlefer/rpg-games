<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мембрана: Ярус</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= ГЛАВНЫЙ ЭКРАН (БАЗА) ================= -->
<!-- Оставляем без изменений (он у тебя уже есть) -->
<div id="main-screen" class="screen active">
    <!-- Верхняя панель, левая, центр, нижняя навигация (как было) -->
    <div id="top-bar">
        <div class="top-left">
            <div class="avatar-frame" onclick="openProfileModal('talents')">
                <img src="images/hero_avatar.png" onerror="this.src='https://via.placeholder.com/60'">
                <div class="level-badge" id="hero-level">1</div>
            </div>
            <div class="hp-xp-bars">
                <div class="bar-container xp-container">
                    <div id="hero-xp-bar" class="bar-fill xp-fill"></div>
                    <span class="bar-text"><span id="hero-xp">0</span> / <span id="hero-xp-to-next">5000</span></span>
                </div>
                <div class="hero-stats-mini">
                    <span class="stat-mini"><i class="icon-hp"></i> <span id="hero-hp">200</span></span>
                    <span class="stat-mini"><i class="icon-dmg"></i> <span id="hero-damage">100</span></span>
                </div>
            </div>
        </div>
        <div class="top-center">
            <div class="currency-block"><img src="images/coin_silver.png" onerror="this.style.display='none'"><span id="hero-silver">0</span></div>
            <div class="currency-block"><img src="images/coin_gold.png" onerror="this.style.display='none'"><span id="hero-gold">0</span></div>
            <div class="currency-block"><img src="images/gem_diamond.png" onerror="this.style.display='none'"><span id="hero-diamonds">0</span></div>
            <div class="currency-block"><img src="images/key.png" onerror="this.style.display='none'"><span id="hero-keys">0</span></div>
        </div>
        <div class="top-right">
            <button class="icon-btn" onclick="openProfileModal('achievements')">🏆</button>
            <button class="icon-btn" onclick="closeModal('save-modal')">⚙️</button>
        </div>
    </div>
    <div id="left-panel">
        <div class="team-member active" onclick="openProfileModal('talents')">
            <div class="team-avatar"><img src="images/hero_avatar.png" onerror="this.src='https://via.placeholder.com/50'"><div class="team-lvl" id="left-hero-level">1</div></div>
            <div class="team-info">Герой</div>
        </div>
    </div>
    <div id="center-panel">
        <div class="hero-display"><img src="images/hero_full.png" class="hero-main-img" onerror="this.src='https://via.placeholder.com/300x400'"></div>
        <div id="equip-container">
            <div class="equip-slot empty" data-slot="helmet"></div>
            <div class="equip-slot empty" data-slot="chest"></div>
            <div class="equip-slot empty" data-slot="legs"></div>
            <div class="equip-slot empty" data-slot="boots"></div>
            <div class="equip-slot empty" data-slot="weapon"></div>
            <div class="equip-slot empty" data-slot="shield"></div>
        </div>
    </div>
    <div id="bottom-nav">
        <div class="nav-group">
            <button class="nav-btn" onclick="goToScreen('shop-screen')"><div class="nav-icon">🛒</div><span>МАГАЗИН</span></button>
            <button class="nav-btn" onclick="goToScreen('inventory-screen')"><div class="nav-icon">🎒</div><span>ИНВЕНТАРЬ</span></button>
        </div>
        <div class="nav-group center">
            <button class="nav-btn main-action" onclick="goToScreen('map-screen')"><div class="nav-icon">🗺️</div><span>КАРТА</span></button>
        </div>
        <div class="nav-group">
            <button class="nav-btn" onclick="goToScreen('tower-screen')"><div class="nav-icon">🗼</div><span>БАШНЯ</span></button>
        </div>
    </div>
</div>

<!-- КАРТА, МАГАЗИН, ИНВЕНТАРЬ, БАШНЯ (Оставляем как было) -->
<!-- ... (код из предыдущего ответа для этих экранов) ... -->
<div id="map-screen" class="screen">
    <div class="map-header"><h1>КАРТА СЕКТОРОВ</h1><button class="back-btn" onclick="goToScreen('main-screen')">НАЗАД</button></div>
    <div class="map-container"><div id="daily-boss-banner"></div><div id="boss-list" class="boss-nodes"></div></div>
</div>

<!-- ================= БОЙ (НОВЫЙ ДИЗАЙН) ================= -->
<div id="battle-screen" class="screen">
    <div class="battle-top-hud">
        <!-- Герой -->
        <div class="fighter-hud left">
            <div class="fighter-name" id="hero-name-battle">ГЕРОЙ</div>
            <div class="bar-container hp-container">
                <div id="hero-hp-bar" class="bar-fill hero-hp-fill"></div>
                <span class="bar-text"><span id="hero-battle-hp">200</span> / <span id="hero-battle-max-hp">200</span></span>
            </div>
        </div>
        
        <!-- Таймер (заглушка) -->
        <div class="battle-timer">01:59:55</div>
        
        <!-- Босс -->
        <div class="fighter-hud right">
            <div class="fighter-name" id="boss-name-battle">БОСС</div>
            <div class="bar-container hp-container">
                <div id="boss-hp-bar" class="bar-fill boss-hp-fill"></div>
                <span class="bar-text"><span id="boss-battle-hp">2000</span> / <span id="boss-battle-max-hp">2000</span></span>
            </div>
        </div>

        <button class="flee-btn" onclick="fleeBattle()">✖</button>
    </div>

    <div class="battle-arena-new">
        <!-- Левая колонка с иконками зелий (можно привязать логику позже) -->
        <div class="battle-left-icons">
            <div class="icon-stack"><div class="b-icon">🛡️</div><span class="b-count">x1</span></div>
            <div class="icon-stack"><div class="b-icon">⚡</div><span class="b-count">x1</span></div>
            <div class="icon-stack"><div class="b-icon">🧪</div><span class="b-count" id="potion-count">3</span></div>
        </div>

        <!-- Герой -->
        <div class="fighter hero-side">
            <img id="hero-img-battle" src="images/hero_full.png" class="fighter-img" onerror="this.src='https://via.placeholder.com/150/1a1a2e/4caf50?text=Hero'">
        </div>
        
        <!-- Босс -->
        <div class="fighter boss-side">
            <div class="boss-img-wrapper">
                <img id="boss-img-battle" src="images/boss.png" class="fighter-img" onerror="this.src='https://via.placeholder.com/150/1a1a2e/e94560?text=Boss'">
                <div id="damage-popups"></div>
            </div>
        </div>
    </div>

    <!-- Круглые кнопки действий -->
    <div class="battle-bottom-actions">
        <button id="btn-action-attack" class="circle-btn" onclick="playerAction('attack')" title="Атака">⚔️</button>
        <button id="btn-action-heavy" class="circle-btn" onclick="playerAction('heavy')" title="Тяжёлый удар">💥</button>
        <button id="btn-action-defend" class="circle-btn" onclick="playerAction('defend')" title="Защита">🛡️</button>
        <button id="btn-action-potion" class="circle-btn" onclick="playerAction('potion')" title="Зелье">🧪</button>
    </div>
    
    <!-- Лог боя (скрыт по умолчанию в новой версии, но пусть будет для отладки) -->
    <div class="log hidden" id="battle-log"></div>
</div>

<!-- ================= ЭКРАН ПОБЕДЫ ================= -->
<div id="victory-screen" class="screen hidden">
    <div class="victory-overlay">
        <!-- Левая панель: лучшие воины -->
        <div class="victory-panel side-panel">
            <h3>ЛУЧШИЕ ВОИНЫ</h3>
            <div class="leaderboard-item">
                <img src="images/hero_avatar.png" class="mini-avatar" onerror="this.style.display='none'">
                <span id="victory-hero-name">Dedlefer</span>
                <span id="victory-hero-dmg">180502</span>
            </div>
        </div>

        <!-- Центр: победа -->
        <div class="victory-panel center-panel">
            <h2 class="victory-title">ПРОТИВНИК<br>ПОВЕРЖЕН!</h2>
            <div class="victory-boss-img">
                <img src="images/boss.png" id="victory-boss-img" onerror="this.style.display='none'">
            </div>
            <div class="victory-stats">
                <div class="stat-line">ТВОЙ УРОН: <span id="victory-total-dmg">180502</span></div>
            </div>
            <button class="gold-btn" id="btn-collect-trophies">СОБРАТЬ ТРОФЕИ</button>
        </div>

        <!-- Правая панель: трофеи -->
        <div class="victory-panel side-panel">
            <h3>ТВОИ ТРОФЕИ</h3>
            <div id="victory-trophies" class="trophy-grid">
                <!-- Заполняется JS -->
            </div>
        </div>
    </div>
</div>

<!-- ================= УНИВЕРСАЛЬНАЯ МОДАЛКА (замена alert) ================= -->
<div id="custom-modal" class="modal hidden">
    <div class="modal-content" style="text-align: center; width: 400px; border: 4px solid var(--gold);">
        <h2 id="cm-title" style="font-size: 24px; margin-bottom: 15px;">ЗАГОЛОВОК</h2>
        <p id="cm-text" style="font-size: 18px; margin-bottom: 20px; color: #fff;">Текст сообщения</p>
        <button id="cm-ok" class="gold-btn" style="width: 100%;">ОК</button>
    </div>
</div>

<!-- Модалка босса (оставляем) -->
<div id="boss-modal" class="modal hidden">
    <div class="boss-modal-content">
        <button class="modal-close-btn" onclick="closeBossModal()">✖</button>
        <div class="bm-header">
            <div class="bm-portrait"><img id="bm-img" src=""></div>
            <div class="bm-title-block">
                <h2 id="bm-name">БОСС</h2>
                <div class="bm-level-badge" id="bm-level">УР. 1</div>
                <p id="bm-desc" class="bm-desc"></p>
            </div>
        </div>
        <p class="bm-intro" id="bm-intro"></p>
        <div class="bm-stats" id="bm-stats"></div>
        <h3 class="bm-reward-title">НАГРАДА</h3>
        <div class="bm-reward" id="bm-reward"></div>
        <button class="bm-fight-btn" id="bm-fight" onclick="startBossFight()">В БОЙ</button>
    </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
